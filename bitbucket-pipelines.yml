image: node:22

definitions:
    caches:
        cache: ~/.cache
        gradle: ~/.gradle
    steps:
        - step: &release
              name: release
              caches:
                  - cache
              script:
                  - npx -p semantic-release -p @semantic-release/changelog -p @semantic-release/git semantic-release
        - step: &tests
              name: Tests
              image: cimg/android:2025.04
              caches:
                  - gradle
              script:
                  - ./gradlew test
              artifacts:
                  - sdk/build/reports/jacoco/**
                  - sdk/build/jacoco/**
        - step: &sonarcloud-analysis
              name: sonar
              caches:
                  - node
              clone:
                  depth: full # SonarCloud scanner needs the full history to assign issues properly
              script:
                  -   pipe: sonarsource/sonarcloud-scan:4.1.0
                      variables:
                          SONAR_SCANNER_OPTS: '-Dsonar.projectBaseDir=.'
                  -   pipe: sonarsource/sonarcloud-quality-gate:0.1.6
        - step: &github-sync
              name: Sync to GitHub
              clone:
                  depth: full
              script:
                  - git fetch origin master
                  - git checkout master
                  # Add GitHub as remote repository (ignore if already exists)
                  # Use GITHUB_PERSONAL_ACCESS_TOKEN for personal token or GITHUB_APP_TOKEN for GitHub App
                  - git remote add github https://${GITHUB_PERSONAL_ACCESS_TOKEN}@github.com/gopaycommunity/gopay-android-sdk.git || true
                  # Fetch current state of GitHub repository to avoid conflicts
                  - git fetch github
                  # Push master branch to GitHub with safe force push
                  - git push github master --force-with-lease

pipelines:
    branches:
        master:
            - parallel:
                  - step: *release
            - step: *tests
            - step: *sonarcloud-analysis
    pull-requests:
        '**':
            - step: *tests
            - step: *sonarcloud-analysis
    custom:
        github-sync:
            - step: *github-sync
