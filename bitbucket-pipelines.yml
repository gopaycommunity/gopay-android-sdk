image: node:22

definitions:
    services:
        docker:
            memory: 7168  # give most of the 2x step's 8 GB to Docker (Sonar pipe runs inside it)
    caches:
        cache: ~/.cache
        gradle: ~/.gradle
    steps:
        - step: &release
              name: release
              caches:
                  - cache
              script:
                  - export REPO_URL=https://gopay-release-bot:$BITBUCKET_BOT_PUSH_TOKEN@bitbucket.org/$BITBUCKET_REPO_FULL_NAME.git
                  - git remote set-url origin $REPO_URL
                  - npx -p semantic-release -p @semantic-release/changelog -p @semantic-release/git -p @semantic-release/exec semantic-release --repository-url $REPO_URL
        - step: &tests
              name: Tests
              image: cimg/android:2025.04
              caches:
                  - gradle
              script:
                  - ./gradlew test
              artifacts:
                  - sdk/build/reports/jacoco/**
                  - sdk/build/jacoco/**
        - step: &sonarcloud-analysis
              name: sonar
              size: 2x
              services:
                  - docker
              caches:
                  - node
              clone:
                  depth: full # SonarCloud scanner needs the full history to assign issues properly
              script:
                  -   pipe: sonarsource/sonarcloud-scan:4.1.0
                      variables:
                          SONAR_SCANNER_OPTS: '-Dsonar.projectBaseDir=.'
                  -   pipe: sonarsource/sonarcloud-quality-gate:0.1.6
        - step: &github-sync
              name: Sync to GitHub
              clone:
                  depth: full
              script:
                  - git fetch origin master --tags
                  - git checkout master
                  # Add GitHub as remote repository (ignore if already exists)
                  # Authenticates via the repository SSH key configured in Pipelines settings,
                  # registered as a write-enabled deploy key on the GitHub mirror
                  - git remote add github git@github.com:gopaycommunity/gopay-android-sdk.git || true
                  # Fetch current state of GitHub repository to avoid conflicts
                  - git fetch github
                  # Push master branch to GitHub with safe force push
                  - git push github master --force-with-lease
                  - git push github --tags

pipelines:
    branches:
        master:
            - parallel:
                  - step: *release
            - step: *tests
            - step: *sonarcloud-analysis
            - step: *github-sync
    pull-requests:
        '**':
            - step: *tests
            - step: *sonarcloud-analysis
    custom:
        github-sync:
            - step: *github-sync
