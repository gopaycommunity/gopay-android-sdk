# SonarQube configuration
sonar.projectKey=gp-gopay_gp-gw-android-sdk
sonar.organization=gp-gopay

# Sources
sonar.sources=sdk/src/main
sonar.java.sources=sdk/src/main/java
sonar.kotlin.files.suffixes=.kt

# Tests
sonar.tests=sdk/src/test
sonar.java.test.sources=sdk/src/test/java
sonar.kotlin.test.sources=sdk/src/test/java
sonar.test.inclusions=**/*Test.kt,**/*Test.java,**/Test*.kt,**/Test*.java

# Coverage configuration (JaCoCo)
sonar.coverage.jacoco.xmlReportPaths=sdk/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
sonar.java.coveragePlugin=jacoco
sonar.kotlin.coverage.reportPaths=sdk/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

# Exclude test files from coverage metrics
sonar.coverage.exclusions=sdk/src/test/**/*,**/*Test*.*,**/androidTest/**/*

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Intentional findings, ignored for one rule in one file each; every other file still gets the
# rule. Each ignore covers the whole file, not a line: a new finding of the same rule there passes
# unreported, so review has to catch it.
#
# manifestBackup (xml:S6358) and manifestCleartext (xml:S5332): the rules want allowBackup and
# usesCleartextTraffic set on <application>. That is right for an app and wrong for this library:
# its manifest is merged into the host's, both decisions belong to the host, and a value set here
# breaks the host's manifest merge when the host sets another one (why usesCleartextTraffic was
# removed). A future allowBackup or usesCleartextTraffic in this manifest would not be flagged and
# does not belong here at all.
#
# deprecatedErrorCodes and deprecatedReturnUrl (kotlin:S1133): the rule flags every @Deprecated as
# code to remove. These deprecations are deliberate for 2.0: the error codes neither SDK throws and
# ChargePaymentResponse.returnUrl stay so code written against them still compiles, and go in 3.0.
# A new deprecation in these two files would not be flagged. Delete both entries in 3.0, once the
# deprecated code is gone.
#
# compatConstructor (kotlin:S1133): the hidden secondary constructor of GopaySDKException is the
# 2.0.0 signature, kept so a host compiled against 2.0.0 runs on 2.1. Delete the entry in 3.0.
#
# compatCardForm (kotlin:S1133): the hidden PaymentCardForm overload is the 2.1.0 signature, kept
# so a host compiled against 2.1.0 runs on 2.2. Delete the entry in 3.0.
sonar.issue.ignore.multicriteria=manifestBackup,manifestCleartext,deprecatedErrorCodes,deprecatedReturnUrl,compatConstructor,compatCardForm
sonar.issue.ignore.multicriteria.manifestBackup.ruleKey=xml:S6358
sonar.issue.ignore.multicriteria.manifestBackup.resourceKey=sdk/src/main/AndroidManifest.xml
sonar.issue.ignore.multicriteria.manifestCleartext.ruleKey=xml:S5332
sonar.issue.ignore.multicriteria.manifestCleartext.resourceKey=sdk/src/main/AndroidManifest.xml
sonar.issue.ignore.multicriteria.deprecatedErrorCodes.ruleKey=kotlin:S1133
sonar.issue.ignore.multicriteria.deprecatedErrorCodes.resourceKey=sdk/src/main/java/cz/gopay/sdk/exception/GopayErrorCodes.kt
sonar.issue.ignore.multicriteria.deprecatedReturnUrl.ruleKey=kotlin:S1133
sonar.issue.ignore.multicriteria.deprecatedReturnUrl.resourceKey=sdk/src/main/java/cz/gopay/sdk/model/ChargeModels.kt
sonar.issue.ignore.multicriteria.compatConstructor.ruleKey=kotlin:S1133
sonar.issue.ignore.multicriteria.compatConstructor.resourceKey=sdk/src/main/java/cz/gopay/sdk/exception/GopaySDKException.kt
sonar.issue.ignore.multicriteria.compatCardForm.ruleKey=kotlin:S1133
sonar.issue.ignore.multicriteria.compatCardForm.resourceKey=sdk/src/main/java/cz/gopay/sdk/ui/PaymentCardForm.kt
